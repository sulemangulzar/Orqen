[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Suleman Gulzar", email = "suleman_gulzar@icloud.com" }
]
requires-python = ">=3.13"
dependencies = [
    "alembic>=1.20.0",
    "argon2-cffi>=25.1.0",
    "asyncpg>=0.31.0",
    "authlib>=1.8.0",
    "cryptography>=50.0.2",
    "email-validator>=2.0.0",
    "fastapi>=0.141.1",
    "greenlet>=3.5.6",
    "langchain>=1.0.0",
    "langchain-openai>=1.0.0",
    "langchain-text-splitters>=1.0.0",
    "langgraph>=1.0.0",
    "crewai>=1.0.0",
    "pgvector>=0.4.1",
    "langchain-pinecone>=0.2.0",
    "pydantic-settings>=2.15.0",
    "pyjwt>=2.15.1",
    "python-multipart>=0.0.32",
    "scalar-fastapi>=1.9.1",
    "sqlalchemy>=2.0.54",
    "sqlmodel>=0.0.47",
    "uvicorn[standard]>=0.54.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.25.0",
    "httpx>=0.28.0",
    "pypdf>=6.21.4",
]

[project.scripts]
backend = "app.main:main"

[build-system]
requires = ["uv_build>=0.12.15,<0.13.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "app"
module-root = ""
